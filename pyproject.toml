[project]
name = "rag"
version = "0.1.0"
description = "My awesome RAG"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bm25s>=0.3.9",
    "fire>=0.7.1",
    "flake8>=7.3.0",
    "langchain>=1.3.13",
    "langchain-text-splitters>=1.1.2",
    "mypy>=2.2.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "tqdm>=4.68.4",
    "transformers>=5.14.1",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"

[tool.mypy]
exclude = ["data/"]
